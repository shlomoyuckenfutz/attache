name: attache-refresh

on:
  schedule:
    # US market window every 15 min: 6:00 AM–1:15 PM PT Mon–Fri.
    # PST (UTC-8, after fall-back): 14:00–21:15 UTC. Re-bump to 13:00–20:15 UTC when PDT returns (spring forward).
    - cron: '0,15,30,45 14-20 * * 1-5'   # 14:00–20:45 UTC = 6:00–12:45 PT (PST)
    - cron: '0,15 21 * * 1-5'             # 21:00 and 21:15 UTC = 1:00 and 1:15 PM PT (PST)
    # Hourly otherwise (nights, early morning, weekends). Overlaps market window; concurrency dedupes.
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: attache-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so pull --rebase can land cleanly

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt

      - name: Class-A refresh
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ATOUCHE_STUDY_PASSWORD: ${{ secrets.ATOUCHE_STUDY_PASSWORD }}
        run: bash pipeline/refresh.sh

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "attache-refresh"
          git config user.email "attache-refresh@users.noreply.github.com"
          # Never commit runtime secrets or rolling bar cache
          rm -f pipeline/desk/secrets/study_password.txt
          git add -A
          git reset -- pipeline/desk/secrets/study_password.txt \
                       pipeline/cache \
                       pipeline/desk/equity_orb15/data/*.parquet \
                       pipeline/desk/python/data/*.parquet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No site changes to commit"
            exit 0
          fi
          git commit -m "attache-refresh: class-A update [skip ci]"
          # Race-safe push: another dispatch / schedule / manual push may land first.
          # concurrency queues overlap; still rebase+retry so 'fetch first' is not fatal.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i) — pull --rebase and retry"
            git pull --rebase origin main
            sleep $((i * 2))
          done
          echo "Push failed after retries" >&2
          exit 1
